<style>
/* VISUAL PREVIEW of the refined Concept A (Owner decisions F14, F16–F22). Not production code.

:root{--carbon:#07080A;--graphite:#101216;--charcoal:#171A1F;--slate:#1E232B;--ink:#0B1220;--ink2:#101A2C;
--text:#F2EFEA;--mute:#A8A49D;--dim:#8C8982;--amber:#FF950E;--pink:#FC0093;--violet:#5109F3;--warm:#FFB36B;
--gl-ink:#231F20;--gl-lime:#C4E563;--gl-pale:#F3F8E2;--glow:#C77A3A;
--vu:min(1vw,1.7svh);--ease:cubic-bezier(.22,1,.36,1);--pad:clamp(20px,5vw,84px);--font:'Poppins',system-ui,sans-serif}
:root[lang=ar]{--font:'Tajawal','Poppins',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:auto}
h1,h2,h3{text-wrap:balance;overflow-wrap:break-word;font-synthesis:none}
html:not(.fonts) h1,html:not(.fonts) h2{visibility:hidden}
body{font-family:var(--font);color:var(--text);font-weight:300;line-height:1.6;background:var(--carbon);overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* ---------- ATMOSPHERE (animated, transform-only layers) ---------- */
.atmos{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--bg,var(--carbon));transition:background 1.2s var(--ease)}
body[data-tone=graphite]{--bg:#0D0F13}body[data-tone=ink]{--bg:#09101C}body[data-tone=carbon]{--bg:#07080A}
.atmos .l{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.atmos .l1{width:70vw;aspect-ratio:1;inset-block-start:-25vw;inset-inline-start:-15vw;background:radial-gradient(circle,rgba(16,26,44,.95),transparent 65%)}
.atmos .l2{width:55vw;aspect-ratio:1;inset-block-end:-20vw;inset-inline-end:-12vw;background:radial-gradient(circle,rgba(255,149,14,.20),transparent 65%)}
.atmos .l3{width:40vw;aspect-ratio:1;inset-block-start:35vh;inset-inline-end:10vw;background:radial-gradient(circle,rgba(252,0,147,.10),transparent 65%)}

.orb{position:fixed;z-index:-2;inset-block-start:4vh;inset-inline-end:3vw;width:min(62vw,860px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 50%,#FF950E) 0,transparent 62%);opacity:.26;filter:blur(46px);transition:background 1.4s var(--ease)}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* ---------- BASICS ---------- */
.bar{direction:ltr;display:flex;height:3px}.bar i{flex:1}.bar i:nth-child(1){background:var(--pink)}.bar i:nth-child(2){background:var(--amber)}.bar i:nth-child(3){background:var(--violet)}

:root[lang=ar] .pill{font-size:15px}
:focus-visible{outline:2px solid var(--warm);outline-offset:3px}

:root[lang=ar] h2.t{line-height:1.35;letter-spacing:0;font-weight:500}:root[lang=ar] h2.t b{font-weight:800}
.reveal{opacity:0;transform:translateY(26px);transition:opacity 1s var(--ease),transform 1s var(--ease)}.reveal.in{opacity:1;transform:none}
.fig{position:relative;overflow:hidden;border-radius:22px;background:var(--charcoal);clip-path:inset(10% 6% round 22px);transition:clip-path 1.2s var(--ease),box-shadow 1s;box-shadow:0 40px 90px -40px rgba(0,0,0,.9)}
.fig.in{clip-path:inset(0 round 22px)}.fig img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.14);transition:transform 1.6s var(--ease),filter .6s}
.fig.in img{transform:scale(1)}.fig:hover img,.fig:focus-within img{transform:scale(1.035)}
.fig::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,149,14,.10),transparent 40%,rgba(7,8,10,.35));pointer-events:none;transition:opacity .6s}.fig:hover::after{opacity:.3}
figcaption{margin-block-start:12px;font-size:12px;color:var(--dim);letter-spacing:.04em}
/* ---------- HEADER ---------- */
header{--hb:46px;--hf:13px;position:fixed;inset-inline:0;top:0;z-index:70;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:24px;padding:20px var(--pad);transition:padding .5s var(--ease),background .5s,box-shadow .5s,backdrop-filter .5s}
header.solid{padding-block:10px;background:rgba(7,8,10,.78);backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 1px 0 rgba(255,255,255,.07)}

header .logoa{display:block;justify-self:start;border-radius:6px}header img.logo{height:44px;width:auto;display:block;transition:height .5s var(--ease)}header.solid img.logo{height:34px}
header .prog{position:absolute;inset-inline:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--pink),var(--amber));transform:scaleX(var(--p,0));transform-origin:0 50%;opacity:0;transition:opacity .4s}header.solid .prog{opacity:.9}:root[dir=rtl] header .prog{transform-origin:100% 50%}
.hnav{display:flex;align-items:center;justify-self:center;gap:clamp(14px,2vw,30px);transition:opacity .35s,visibility .35s}
.hact{display:flex;align-items:center;justify-self:end;gap:12px}

.hnav a::after{content:"";position:absolute;inset-inline:0;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--pink),var(--amber));transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}:root[dir=rtl] .hnav a::after{transform-origin:100% 50%}
.hnav a:hover,.hnav a:focus-visible,.hnav a[aria-current=true]{opacity:1}
.hnav a:hover::after,.hnav a:focus-visible::after,.hnav a[aria-current=true]::after{transform:scaleX(1)}
.hnav a.nl{opacity:1;color:var(--gl-lime);font-weight:500}.hnav a.nl::after{background:var(--gl-lime)}
/* appointment CTA: pill, same height/radius as the Menu button, different (ink-blue) dark shade */
.cta{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:var(--hb);padding-inline:clamp(18px,1.6vw,26px);border-radius:999px;border:1px solid rgba(242,239,234,.2);background:rgba(18,30,52,.92);color:var(--text);text-decoration:none;font-size:13px;font-weight:500;line-height:1;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:border-color .35s,background .35s,transform .5s var(--ease),opacity .35s,visibility .35s}:root[lang=ar] .cta{font-size:15px}.cta,.menu{padding-block:0}.cta{padding-inline:22px;padding-block-end:2px}:root[lang=ar] .cta,:root[lang=ar] .menu:not(:has(.mt[style])) .mt{padding-top:3px;padding-bottom:0}:root[lang=ar] .cta{padding-block-end:0}
.cta:hover,.cta:focus-visible{border-color:rgba(255,179,107,.75);background:rgba(27,44,76,.97)}.cta:focus-visible{outline:2px solid var(--warm);outline-offset:3px}.cta:active{transform:scale(.97)}
.menu{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:12px;height:var(--hb);padding-inline:18px;border:1px solid rgba(242,239,234,.28);border-radius:999px;font-size:13px;font-weight:500;color:var(--text);background:rgba(7,8,10,.35);-webkit-tap-highlight-color:transparent;transition:border-color .35s,background .35s,transform .5s var(--ease)}:root[lang=ar] .menu{font-size:15px}
.menu .mt{position:relative;display:grid;overflow:hidden;line-height:1.2}.menu .mt span{grid-area:1/1;transition:transform .5s var(--ease),opacity .4s}.menu .mt span+span{transform:translateY(120%);opacity:0}
body.menu-open .menu .mt span:first-child{transform:translateY(-120%);opacity:0}body.menu-open .menu .mt span+span{transform:none;opacity:1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.menu .bx{position:relative;width:22px;height:14px;flex:none}
.menu .bx i{position:absolute;inset-inline-start:0;width:100%;height:2px;border-radius:2px;background:var(--text);transform-origin:50% 50%;transition:transform .55s var(--ease),opacity .25s,width .4s var(--ease),background .3s}
.menu .bx i:nth-child(1){top:0}.menu .bx i:nth-child(2){top:6px}.menu .bx i:nth-child(3){top:12px}
.menu:hover,.menu:focus-visible{border-color:var(--amber);background:rgba(255,149,14,.1)}.menu:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
.menu:hover .bx i:nth-child(2),.menu:focus-visible .bx i:nth-child(2){width:68%}
.menu:active{transform:scale(.96)}
body.menu-open .menu .bx i:nth-child(1){transform:translateY(6px) rotate(45deg)}body.menu-open .menu .bx i:nth-child(2){opacity:0;transform:scaleX(0)}body.menu-open .menu .bx i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
body.menu-open .menu .bx i{background:var(--warm)}body.menu-open .menu:hover .bx i:nth-child(2){width:100%}
body.menu-open{overflow:hidden}
/* fullscreen sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,4vh,40px);padding:clamp(84px,11vh,120px) var(--pad) clamp(20px,4vh,40px);overflow-y:auto;overflow-x:hidden;background:#07080A;visibility:hidden;pointer-events:none;clip-path:circle(0 at var(--ox,calc(100% - 70px)) var(--oy,44px));transition:clip-path .9s var(--ease),visibility 0s .9s}
.sheet.open{visibility:visible;pointer-events:auto;clip-path:circle(150vmax at var(--ox,calc(100% - 70px)) var(--oy,44px));transition:clip-path 1s var(--ease),visibility 0s}
.sheet .bgfx{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 60vmax at 85% 0%,rgba(16,26,44,.95),transparent 70%),radial-gradient(40vmax 40vmax at 10% 100%,rgba(255,149,14,.10),transparent 70%)}
.sheet .sg{position:absolute;inset-inline-start:50%;inset-block-start:0;width:min(60vw,640px);aspect-ratio:1;margin-block-start:calc(min(60vw,640px)/-2);margin-inline-start:calc(min(60vw,640px)/-2);border-radius:50%;background:radial-gradient(circle,rgba(255,149,14,.20),rgba(252,0,147,.08) 45%,transparent 68%);filter:blur(30px);transform:translateY(var(--gy,30vh));transition:transform 1.1s var(--ease),opacity .6s;opacity:.9;pointer-events:none;z-index:-1}
.snav{display:flex;flex-direction:column;max-inline-size:1100px;width:100%;margin-inline:auto}
.si{position:relative;display:grid;grid-template-columns:clamp(44px,6vw,80px) 1fr auto;column-gap:clamp(8px,1.6vw,24px);align-items:center;min-height:56px;padding-block:clamp(2px,.7vh,8px);color:var(--text);text-decoration:none;font-size:clamp(24px,min(4.6vw,5.4vh),50px);font-weight:600;line-height:1.2;letter-spacing:-.012em;border-block-end:1px solid var(--slate);-webkit-tap-highlight-color:transparent;opacity:0;transform:translateY(48px);transition:opacity .35s,transform .35s var(--ease),color .35s}
:root[lang=ar] .si{font-weight:800;letter-spacing:0;line-height:1.35}
.sheet.open .si{opacity:1;transform:none;transition:opacity .7s var(--ease) calc(.2s + var(--i)*.06s),transform .9s var(--ease) calc(.2s + var(--i)*.06s),color .3s}
.si .sn{font-size:13px;font-weight:500;letter-spacing:.12em;color:var(--dim);direction:ltr;text-align:start;transition:color .3s}
.si .st{display:block;transition:transform .6s var(--ease)}.si .sa{font-size:.5em;font-weight:300;opacity:0;transform:translateX(-14px);transition:opacity .4s,transform .6s var(--ease)}:root[dir=rtl] .si .sa{transform:translateX(14px) scaleX(-1)}
.si::before{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--pink),var(--amber));transform:scaleX(0);transform-origin:0 50%;transition:transform .8s var(--ease)}:root[dir=rtl] .si::before{transform-origin:100% 50%}
.si:hover::before,.si:focus-visible::before,.si[aria-current=true]::before{transform:scaleX(1)}
.si:hover .st,.si:focus-visible .st{transform:translateX(14px)}:root[dir=rtl] .si:hover .st,:root[dir=rtl] .si:focus-visible .st{transform:translateX(-14px)}
.si:hover .sn,.si:focus-visible .sn,.si[aria-current=true] .sn{color:var(--amber)}
.si:hover .sa,.si:focus-visible .sa{opacity:1;transform:none}:root[dir=rtl] .si:hover .sa,:root[dir=rtl] .si:focus-visible .sa{transform:scaleX(-1)}
.si[aria-current=true]{color:var(--warm)}.si[aria-current=true] .sn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--amber));margin-inline-end:8px;vertical-align:middle}
.si.nl{color:var(--gl-lime)}.si.nl::before{background:var(--gl-lime)}
.si:focus-visible{outline:2px solid var(--warm);outline-offset:-2px;border-radius:6px}
.sheet.open .snav:has(.si:hover) .si:not(:hover),.sheet.open .snav:has(.si:focus-visible) .si:not(:focus-visible){opacity:.42}
.sfoot{display:flex;flex-wrap:wrap;gap:14px 34px;align-items:center;max-inline-size:1100px;width:100%;margin-inline:auto;font-size:14px;color:var(--mute);opacity:0;transform:translateY(20px);transition:opacity .3s,transform .3s}
.sheet.open .sfoot{opacity:1;transform:none;transition:opacity .8s var(--ease) .75s,transform .9s var(--ease) .75s}
.sfoot .lang{margin-inline-start:auto;border:1px solid rgba(242,239,234,.28);border-radius:999px;padding:9px 18px;color:var(--text)}.sfoot .lang:hover{border-color:var(--amber)}
.sfoot .cl a{color:var(--mute)}.sfoot .cl a:hover,.sfoot .cl a:focus-visible{color:var(--text)}
@media(min-width:1700px){header img.logo{height:50px}header.solid img.logo{height:38px}}
@media(max-width:1099px){.hact .cta{display:none}}
/* ---------- HERO ---------- */
.hero{min-height:100svh;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;padding:max(130px,calc(var(--vu)*6.5)) var(--pad) max(80px,calc(var(--vu)*4.4));gap:max(30px,calc(var(--vu)*2.1));position:relative}
.eyebrow{display:flex;align-items:center;gap:max(14px,calc(var(--vu)*.97));font-size:max(12px,calc(var(--vu)*.833));font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}.eyebrow .bar{width:max(56px,calc(var(--vu)*3.9))}
:root[lang=ar] .eyebrow{letter-spacing:0;font-size:14px;font-weight:700}
h1{font-size:clamp(44px,5.3vw,max(92px,min(5.3vw,10.5svh)));line-height:1.1;letter-spacing:-.02em;font-weight:700;margin-block:max(26px,calc(var(--vu)*1.8)) 0}

:root[lang=ar] h1{line-height:1.3;letter-spacing:0;font-weight:800;font-size:clamp(42px,6vw,98px)}:root[lang=ar] h1 span:nth-child(2){font-weight:300;padding-inline-start:0}:root[lang=ar] h1{text-align:start}
.sub{max-inline-size:36ch;color:var(--mute);margin-block:max(28px,calc(var(--vu)*1.95)) max(34px,calc(var(--vu)*2.36));font-size:max(17px,calc(var(--vu)*1.18))}
.hero .pill{font-size:max(13px,calc(var(--vu)*.9));padding:max(13px,calc(var(--vu)*.9)) max(26px,calc(var(--vu)*1.8))}:root[lang=ar] .sub{font-size:max(19px,calc(var(--vu)*1.32))}
.stage{--pw:max(min(23vw,320px),min(34svh,25vw));--dir:1;container-type:inline-size;position:relative;min-height:min(76svh,max(700px,calc(var(--vu)*48.6)));touch-action:pan-y;-webkit-user-select:none;user-select:none}:root[dir=rtl] .stage{--dir:-1}

/* ---------- HERO CAROUSEL: the three posters ARE the navigation (no thumbnail strip) ---------- */
.slide{--x:0px;--y:0px;--r:0deg;--s:1;--o:1;--z:3;position:absolute;left:50%;top:50%;width:var(--pw);aspect-ratio:9/16;border-radius:max(22px,calc(var(--vu)*1.5));overflow:hidden;background:var(--charcoal);transform:translate(-50%,-50%) translate(calc(var(--x)*var(--dir)),var(--y)) rotate(calc(var(--r)*var(--dir))) scale(var(--s));opacity:var(--o);z-index:var(--z);will-change:transform,opacity;transition:transform .9s var(--ease),opacity .8s var(--ease),box-shadow 1s var(--ease),filter .8s var(--ease),visibility 0s linear 0s}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 62%,rgba(0,0,0,.7));pointer-events:none}

.slide[data-pos="1"]{--x:min(var(--pw)*.72,50cqw - var(--pw)*.43);--y:calc(var(--pw)*-.094);--r:5deg;--s:.6875;--o:.5;--z:2;filter:saturate(.8)}
.slide[data-pos="-2"],.slide[data-pos="2"]{--s:.5;--o:0;--z:1;visibility:hidden;transition-delay:0s,0s,0s,0s,.85s}
.slide[data-pos="-2"]{--x:calc(min(var(--pw)*1.3,50cqw - var(--pw)*.32)*-1);--y:calc(var(--pw)*.2);--r:-9deg}.slide[data-pos="2"]{--x:min(var(--pw)*1.3,50cqw - var(--pw)*.32);--y:calc(var(--pw)*-.15);--r:8deg}

 function check(el){const w=el.closest('.fld');if(!w||!el.required)return true;const ok=(V[el.type]||V.area)(el.value);w.classList.toggle('bad',!ok);el.setAttribute('aria-invalid',!ok);$('.err',w).textContent=ok?'':msg(el);return ok}
 f.addEventListener('focusout',e=>{if(e.target.required&&e.target.value!=='')check(e.target)});
 f.addEventListener('input',e=>{const w=e.target.closest('.fld');if(w&&w.classList.contains('bad'))check(e.target);$('#nt').classList.remove('on')});
 const tabs=$$('.tabs [role=tab]');function sel(k,focus){act=k;tabs.forEach(b=>{const on=b.dataset.k===k;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;$('#pn-'+b.dataset.k).hidden=!on;if(on&&focus)b.focus()});$('#fsum').classList.remove('on');$('#nt').classList.remove('on')}
 tabs.forEach((b,i)=>{b.onclick=()=>sel(b.dataset.k);b.onkeydown=e=>{const d={ArrowRight:LANG==='ar'?-1:1,ArrowLeft:LANG==='ar'?1:-1}[e.key];if(d){e.preventDefault();sel(tabs[(i+d+tabs.length)%tabs.length].dataset.k,true)}}});
 f.addEventListener('submit',e=>{e.preventDefault();const reqs=$$('[required]',f).filter(el=>!el.closest('[hidden]'));const bad=reqs.filter(el=>!check(el));const fs=$('#fsum'),nt=$('#nt');
  if(bad.length){nt.classList.remove('on');fs.innerHTML=`${t.fixN} `+bad.map(el=>`<a href="#${el.id}" data-keep>${el.closest('.fld').querySelector('label').childNodes[0].textContent}</a>`).join(' · ');fs.classList.add('on');fs.focus();return}
  fs.classList.remove('on');const lines=[];$$('.fld',f).filter(w=>!w.closest('[hidden]')).forEach(w=>{const l=($('label',w)||$('.lb',w)).childNodes[0].textContent.trim();const i=$('input:not([type=radio]),select,textarea',w);const r=$('input:checked',w);const v=i?i.value:r?r.value:'';if(v)lines.push(`${l}: ${v}`)});
  $('#nm').href=`mailto:${MAIL}?subject=${encodeURIComponent('Book Appointment — '+FORM.tabs.find(x=>x.k===act).l[0]+' (preview form)')}&body=${encodeURIComponent(lines.join('\n'))}`;nt.classList.add('on');nt.focus()});
 f.addEventListener('click',e=>{const a=e.target.closest('a[data-keep]');if(a){e.preventDefault();const el=document.getElementById(a.getAttribute('href').slice(1));el&&el.focus()}})})();
</script></body></html>
